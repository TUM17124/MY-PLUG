<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=`, initial-scale=1.0">
    <title>MY PLUG</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
     <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
 crossorigin=""></script>
 <style>
    #map { height: 100vh; }
</style>
</head>
<body>
    

    <div id="map"></div>

    <script>
        var map = L.map('map');
        map.setView([51.505, -0.09], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);


navigator.geolocation.watchPosition(success, error, );

let marker,circle,zoomed;

function success(pos) {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const accuracy = pos.coords.accuracy;

    if (marker) {
        map.removeLayer(marker);
        map.removeLayer(circle);
    }

   marker= L.marker([lat, lon]).addTo(map)
   circle= L.circle([lat, lon], { radius:accuracy}).addTo(map)

   if(!zoomed){
   zoomed = map.fitBounds(circle.getBounds());
   }

   map.setView([lat, lon]);

}
function error(err) {
    if (err.code == 1) {
        alert("Please allow location access to use this feature.");
    } else if (err.code == 2) {
        alert("Location not found. Please check your GPS settings.");
    }
   
}
    // Define custom WhatsApp icons
    var whatsappIcon = L.icon({
            iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg',
            iconSize: [100, 100],
            iconAnchor: [20, 40],
            popupAnchor: [0, -40]
        });
         // Add marker at KICC with WhatsApp popup link
         L.marker([-0.16581, 35.96725], { icon: whatsappIcon }).addTo(map)
  .bindPopup(`
    <div style="text-align:center;">
      <p>
        <a href="https://wa.me/254741389658?text=Hey%2C%20I%27m%20around%20Kabarak" target="_blank">
          📱 Chat on WhatsApp
        </a>
      </p>
      <p>
        <a href="productcs.html" target="_blank">
          🛒 Check My Products
        </a>
      </p>
    </div>
  `)
  .openPopup();

    </script>
</body>
</html>
